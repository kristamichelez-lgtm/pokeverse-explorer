<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéVerse Explorer</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,Arial}header{background:linear-gradient(125deg,#ef4444,#f97316);padding:38px 16px;text-align:center}h1{font-size:clamp(30px,7vw,52px);margin:0}header p{margin:8px}main{max-width:1100px;margin:auto;padding:20px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #64748b;background:#1e293b;color:white;font-size:16px}.filters{display:flex;overflow:auto;gap:8px;padding:16px 0}.filters button,.more,.back{cursor:pointer;border:0;border-radius:22px;padding:9px 15px;background:#334155;color:white}.filters button.active,.more{background:#facc15;color:#111827;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;text-align:left;color:white;cursor:pointer}.card:hover{border-color:#facc15}.card img{width:100%;height:130px;object-fit:contain}.number{color:#94a3b8;font-size:12px}.name{font-weight:800;text-transform:capitalize;font-size:19px}.type{display:inline-block;border-radius:15px;padding:4px 9px;font-size:11px;margin:5px 3px 0 0;background:#64748b}.grass{background:#39965d}.fire{background:#e86b3d}.water{background:#3788cf}.electric{background:#e8bb29;color:#172033}.psychic{background:#cf5186}.dragon{background:#6d55bb}.ghost{background:#66518b}.fairy{background:#d17bb3}.poison{background:#9953ad}.ice{background:#429eae}.fighting{background:#b94e48}.ground{background:#ac8c4b}.rock{background:#918052}.steel{background:#647e90}.dark{background:#5d5260}.bug{background:#7c9c35}.flying{background:#7488bf}.normal{background:#858e81}.more{display:block;margin:22px auto;padding:12px 24px}#detail{display:none;background:#1e293b;border-radius:18px;padding:22px;max-width:650px;margin:auto}#detail img{width:220px;max-width:100%;display:block;margin:auto}#detail h2{text-align:center;font-size:30px}.stats{margin-top:18px}.stat{margin:10px 0}.bar{height:9px;background:#334155;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#facc15,#fb7185)}footer{text-align:center;color:#94a3b8;padding:25px;font-size:12px}#detail select{width:100%;background:#334155;color:white;border:1px solid #64748b;border-radius:10px;padding:11px;margin:8px 0 12px;font-size:15px}#detail .detailblock{background:#1e293b;border:1px solid #334155;padding:16px;border-radius:15px;margin-top:15px}#detail h3{margin:24px 0 10px;color:#fde68a}#detail .entry{line-height:1.6;background:#0f172a;padding:15px;border-radius:10px}#detail .abilitylist{padding-left:20px}#detail .abilitylist li{margin:14px 0}#detail .abilitydesc{color:#cbd5e1;margin:5px 0;font-size:14px;line-height:1.5}#detail .smallpill{font-size:11px;background:#7c3aed;padding:3px 7px;border-radius:9px}#detail .muted{color:#aab8ca;font-size:13px}#detail .movesgroup{background:#0f172a;border:1px solid #334155;border-radius:10px;margin:10px 0;padding:12px}#detail summary{cursor:pointer;font-weight:700}#detail .movelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin-top:12px}#detail .movelist>div{background:#243247;border-radius:7px;padding:8px;font-size:13px}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"></head><body><header><div style="font-size:42px">⚡</div><h1>PokéVerse Explorer</h1><p>Discover Pokémon, their types, abilities, and stats!</p></header><main><section id="browse"><h2>National Pokédex</h2><input id="search" placeholder="🔎 Search Pokémon name or number" aria-label="Search Pokémon"><div class="filters" id="filters"></div><p id="status">Loading Pokémon…</p><div class="grid" id="grid"></div><button class="more" id="more">Load more ↓</button></section><section id="detail"></section></main><footer>Unofficial fan website. Pokémon belongs to its respective owners. Data and artwork from PokéAPI.</footer><script>
const types=['All','Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];const $=s=>document.querySelector(s);let pokemon=[],type='All',term='',limit=30;const art=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;const cap=s=>s.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());const tags=a=>a.map(t=>`<span class="type ${t}">${cap(t)}</span>`).join('');$('#filters').innerHTML=types.map(t=>`<button data-type="${t}" class="${t==='All'?'active':''}">${t}</button>`).join('');$('#filters').onclick=e=>{let b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;limit=30;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()};$('#search').oninput=e=>{term=e.target.value.toLowerCase().trim();limit=30;render()};$('#more').onclick=()=>{limit+=30;render()};function render(){let arr=pokemon.filter(p=>(type==='All'||p.types.includes(type.toLowerCase()))&&(!term||p.name.includes(term)||String(p.id)===term||String(p.id).padStart(4,'0')===term));$('#status').textContent=`${arr.length} Pokémon found`;$('#grid').innerHTML=arr.slice(0,limit).map(p=>`<button class="card" data-id="${p.id}"><div class="number">#${String(p.id).padStart(4,'0')}</div><img loading="lazy" src="${art(p.id)}" alt="${cap(p.name)}"><div class="name">${cap(p.name)}</div>${tags(p.types)}</button>`).join('');$('#more').style.display=arr.length>limit?'block':'none'}$('#grid').onclick=e=>{let b=e.target.closest('[data-id]');if(b)show(Number(b.dataset.id))};async function show(id){
let p=pokemon.find(x=>x.id===id);$('#browse').style.display='none';$('#detail').style.display='block';
$('#detail').innerHTML=`<button class="back" id="back">← Back to Pokédex</button><div class="number">#${String(id).padStart(4,'0')}</div><img src="${art(id)}" alt="${cap(p.name)}"><h2>${cap(p.name)}</h2><p style="text-align:center">${tags(p.types)}</p><div id="info">Loading Pokédex entries, abilities, and moves…</div>`;
$('#back').onclick=()=>{$('#detail').style.display='none';$('#browse').style.display='block'};window.scrollTo(0,0);
const clean=t=>String(t||'').replace(/[\f\n\r]+/g,' ').replace(/\s+/g,' ').trim();
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{
let [pr,sr]=await Promise.all([fetch(`https://pokeapi.co/api/v2/pokemon/${id}`),fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)]);
if(!pr.ok||!sr.ok)throw Error('PokéAPI unavailable');let d=await pr.json(),sp=await sr.json();
let entries=sp.flavor_text_entries.filter(x=>x.language.name==='en');
let groups=[...new Set(d.moves.flatMap(x=>x.version_group_details.map(v=>v.version_group.name)))];
let versions=[...new Set(entries.map(x=>x.version.name))];
let abilityRows=d.abilities.map(a=>`<li><b>${esc(cap(a.ability.name))}</b>${a.is_hidden?' <span class="smallpill">Hidden ability</span>':''}<div class="abilitydesc" data-ability="${esc(a.ability.name)}">Loading description…</div></li>`).join('');
$('#info').innerHTML=`<div class="detailblock"><p><b>Height:</b> ${d.height/10} m &nbsp; <b>Weight:</b> ${d.weight/10} kg</p><p><b>Species:</b> ${esc(sp.genera.find(x=>x.language.name==='en')?.genus||'Pokémon')}</p><h3>📖 Pokédex Entries</h3><label for="entry-game">Choose a game:</label><select id="entry-game"></select><p id="entry-text" class="entry"></p><h3>✨ Abilities & Hidden Abilities</h3><ul class="abilitylist">${abilityRows||'<li>No ability data available.</li>'}</ul><h3>⚔️ Learnable Moves</h3><p class="muted">Move lists depend on the game. Select a game to see every move listed for that version group and how it is learned.</p><label for="move-game">Game / version group:</label><select id="move-game"></select><p id="move-count" class="muted"></p><div id="move-list"></div><h3>📊 Base Stats</h3><div class="stats">${d.stats.map(s=>`<div class="stat">${cap(s.stat.name)}: <b>${s.base_stat}</b><div class="bar"><div class="fill" style="width:${Math.min(100,s.base_stat/255*100)}%"></div></div></div>`).join('')}</div></div>`;
const entrySelect=$('#entry-game'),moveSelect=$('#move-game');
entrySelect.innerHTML=versions.map(v=>`<option value="${esc(v)}">${esc(cap(v))}</option>`).join('');
const showEntry=()=>{let e=entries.find(x=>x.version.name===entrySelect.value);$('#entry-text').textContent=e?clean(e.flavor_text):'No English Pokédex entry available.'};
entrySelect.onchange=showEntry;showEntry();
moveSelect.innerHTML=groups.slice().reverse().map(v=>`<option value="${esc(v)}">${esc(cap(v))}</option>`).join('');
const showMoves=()=>{let group=moveSelect.value;let moves=d.moves.flatMap(m=>m.version_group_details.filter(v=>v.version_group.name===group).map(v=>({name:m.move.name,method:v.move_learn_method.name,level:v.level_learned_at}))).sort((a,b)=>a.method.localeCompare(b.method)||a.level-b.level||a.name.localeCompare(b.name));
$('#move-count').textContent=`${moves.length} learnable move records in ${cap(group)} (methods and levels shown below).`;
let by={};for(let m of moves)(by[m.method]??=[]).push(m);
$('#move-list').innerHTML=moves.length?Object.entries(by).map(([method,items])=>`<details class="movesgroup" open><summary>${esc(cap(method))} (${items.length})</summary><div class="movelist">${items.map(m=>`<div>${esc(cap(m.name))}${m.method==='level-up'?` <span class="muted">Lv. ${m.level}</span>`:''}</div>`).join('')}</div></details>`).join(''):'<p>No moves are listed for this version group.</p>'};
moveSelect.onchange=showMoves;showMoves();
await Promise.all(d.abilities.map(async a=>{try{let r=await fetch(a.ability.url);if(!r.ok)throw Error();let info=await r.json();let desc=info.effect_entries.find(x=>x.language.name==='en')?.short_effect||info.flavor_text_entries.find(x=>x.language.name==='en')?.flavor_text||'No English description available.';let el=[...document.querySelectorAll('.abilitydesc')].find(x=>x.dataset.ability===a.ability.name);if(el)el.textContent=clean(desc)}catch(e){let el=[...document.querySelectorAll('.abilitydesc')].find(x=>x.dataset.ability===a.ability.name);if(el)el.textContent='Description unavailable.'}}));
}catch(e){$('#info').textContent='Could not load Pokédex details. Check your internet connection and try again.'}
}
async function init(){try{let r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');if(!r.ok)throw Error();let d=await r.json();pokemon=d.results.map((p,i)=>({id:i+1,name:p.name,types:[]}));render();$('#status').textContent='Loading Pokémon types…';let tr=await fetch('https://pokeapi.co/api/v2/type');let td=await tr.json();await Promise.all(td.results.filter(t=>types.some(x=>x.toLowerCase()===t.name)).map(async t=>{let rr=await fetch(t.url);let dd=await rr.json();for(let item of dd.pokemon){let id=Number(item.pokemon.url.match(/\/pokemon\/(\d+)\//)?.[1]);if(id>0&&id<=pokemon.length)pokemon[id-1].types.push(t.name)}}));render()}catch(e){$('#status').textContent='Unable to load Pokédex. Check your internet connection and refresh.'}}init();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
